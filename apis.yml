aid: accesshope
name: AccessHope
description: 'AccessHope is a Los Angeles-area health benefits company, founded in
  2019 and wholly owned by City of Hope, that delivers remote cancer expertise as an
  employer-sponsored benefit. Its subspecialist teams review a member''s pathology,
  imaging, molecular testing and treatment plan against the latest evidence from a
  coalition of National Cancer Institute-designated Comprehensive Cancer Centers —
  City of Hope, Dana-Farber Cancer Institute, Emory Winship, Fred Hutch, Johns Hopkins
  Kimmel, Northwestern Medicine Lurie, and UT Southwestern Simmons — and return guidance
  to the member''s own local oncologist rather than moving the patient. AccessHope
  reports roughly 9 million covered members across 700+ employer and health-plan clients,
  including 70+ Fortune 500 companies. Delivery is business-to-business: employers,
  benefits consultants, health plans and navigation partners onboard through an eligibility
  file feed and an implementation-managed workflow, while members and clinical staff
  use credentialed web portals. AccessHope publishes no public developer program, API
  documentation, or machine-readable API contract.'
